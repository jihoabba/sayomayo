<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COIN SAYOMAYO</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --border-light: #2a2a3e;
    --text: #e8e8f0;
    --text-muted: #6060a0;
    --text-dim: #3a3a5a;
    --accent: #00ff88;
    --accent-dim: rgba(0,255,136,0.1);
    --warn: #ff6b35;
    --warn-dim: rgba(255,107,53,0.1);
    --danger: #ff3366;
    --danger-dim: rgba(255,51,102,0.1);
    --hold: #ffd700;
    --hold-dim: rgba(255,215,0,0.1);
    --up: #00ff88;
    --down: #ff3366;
    --btc-color: #f7931a;
    --eth-color: #627eea;
    --xrp-color: #00aae4;
    --sol-color: #9945ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    z-index: 100;
  }

  header .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--text);
  }

  .logo .coin { color: var(--btc-color); }
  .logo .dot { color: var(--accent); }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
    display: inline-block;
    margin-right: 5px;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  /* ── Main ── */
  main { padding: 32px 0 80px; }

  /* ── Market Bar ── */
  .market-bar {
    margin-bottom: 28px;
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    display: flex;
    gap: 28px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .market-bar::-webkit-scrollbar { display: none; }

  .market-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .market-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .market-value {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px 24px;
    cursor: pointer;
    margin-bottom: -1px;
    transition: all 0.2s;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Action Bar ── */
  .action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .action-bar-left {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .btn-analyze-all {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 24px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }

  .btn-analyze-all:hover { background: #00cc6e; transform: translateY(-1px); }
  .btn-analyze-all:disabled { background: var(--border-light); color: var(--text-dim); cursor: not-allowed; transform: none; }

  /* ── Coin Grid ── */
  .coin-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  /* ── Coin Card ── */
  .coin-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.2s;
  }

  .coin-card:hover { border-color: var(--border-light); transform: translateY(-2px); }

  .coin-card[data-coin="BTC"] { --coin-color: var(--btc-color); }
  .coin-card[data-coin="ETH"] { --coin-color: var(--eth-color); }
  .coin-card[data-coin="XRP"] { --coin-color: var(--xrp-color); }
  .coin-card[data-coin="SOL"] { --coin-color: var(--sol-color); }

  .card-top {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
  }

  .card-top::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--coin-color);
  }

  .card-coin-info { padding-left: 6px; }

  .card-coin-id {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--coin-color);
    letter-spacing: -0.5px;
  }

  .card-coin-name {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .card-analyze-btn {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 5px 12px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
    white-space: nowrap;
    align-self: flex-start;
  }

  .card-analyze-btn:hover { border-color: var(--coin-color); color: var(--coin-color); }
  .card-analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Price section */
  .card-price-section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  .price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .price-krw {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .price-badges {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .price-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 1px;
  }

  .badge-up { color: var(--up); background: rgba(0,255,136,0.08); }
  .badge-down { color: var(--down); background: rgba(255,51,102,0.08); }
  .badge-neutral { color: var(--text-muted); background: rgba(100,100,160,0.08); }

  .price-usd {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .price-placeholder {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    padding: 8px 0;
  }

  /* Signal */
  .card-signal-section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .signal-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 1px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .signal-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .sig-buy   { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,255,136,0.3); }
  .sig-hold  { background: var(--hold-dim);   color: var(--hold);   border: 1px solid rgba(255,215,0,0.3); }
  .sig-partial { background: var(--warn-dim); color: var(--warn);   border: 1px solid rgba(255,107,53,0.3); }
  .sig-sell  { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(255,51,102,0.3); }
  .sig-loading { background: rgba(100,100,150,0.1); color: var(--text-muted); border: 1px solid var(--border-light); }

  .prev-signal-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .prev-signal-badge .prev-label { text-transform: uppercase; letter-spacing: 1px; }
  .prev-signal-badge .prev-arrow { color: var(--text-muted); }

  /* Analysis */
  .card-analysis-section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    min-height: 80px;
  }

  .analysis-main {
    font-size: 12px;
    line-height: 1.75;
    color: var(--text-muted);
  }

  .analysis-prev-comment {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(100,100,160,0.06);
    border-left: 2px solid var(--border-light);
    font-size: 11px;
    line-height: 1.6;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  .analysis-prev-comment .prev-comment-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 12px 0;
  }

  .typing-indicator span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: typing 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Indicators */
  .card-indicators {
    padding: 12px 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .ind-item { display: flex; flex-direction: column; gap: 2px; }

  .ind-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .ind-value {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .ind-value.bullish { color: var(--up); }
  .ind-value.bearish { color: var(--down); }
  .ind-value.neutral { color: var(--hold); }

  .card-timestamp {
    padding: 8px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* ── History Tab ── */
  .history-section { }

  .coin-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .coin-sel-btn {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 7px 18px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }

  .coin-sel-btn:hover { color: var(--text); border-color: var(--text-muted); }

  .coin-sel-btn.active[data-coin="BTC"] { color: var(--btc-color); border-color: var(--btc-color); background: rgba(247,147,26,0.08); }
  .coin-sel-btn.active[data-coin="ETH"] { color: var(--eth-color); border-color: var(--eth-color); background: rgba(98,126,234,0.08); }
  .coin-sel-btn.active[data-coin="XRP"] { color: var(--xrp-color); border-color: var(--xrp-color); background: rgba(0,174,228,0.08); }
  .coin-sel-btn.active[data-coin="SOL"] { color: var(--sol-color); border-color: var(--sol-color); background: rgba(153,69,255,0.08); }

  /* Hit Rate */
  .hit-rate-box {
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .hit-rate-left { display: flex; align-items: center; gap: 20px; }

  .hit-rate-number {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 36px;
    line-height: 1;
  }

  .hit-rate-number.good { color: var(--accent); }
  .hit-rate-number.warn { color: var(--hold); }
  .hit-rate-number.bad  { color: var(--danger); }

  .hit-rate-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .hit-rate-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .hit-rate-sub {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .hit-rate-bar {
    width: 160px;
    height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    overflow: hidden;
  }

  .hit-rate-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .hit-rate-bar-fill.good { background: var(--accent); }
  .hit-rate-bar-fill.warn { background: var(--hold); }
  .hit-rate-bar-fill.bad  { background: var(--danger); }

  /* Improvement box */
  .improvement-box {
    padding: 16px 20px;
    background: var(--danger-dim);
    border: 1px solid rgba(255,51,102,0.2);
    border-radius: 2px;
    margin-bottom: 20px;
  }

  .improvement-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--danger);
    margin-bottom: 10px;
  }

  .improvement-body {
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  .improvement-list {
    margin: 8px 0 0 4px;
    padding-left: 12px;
    list-style: none;
  }

  .improvement-list li {
    position: relative;
    padding-left: 12px;
    margin-bottom: 4px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .improvement-list li::before {
    content: '→';
    position: absolute;
    left: -4px;
    color: var(--danger);
    font-size: 10px;
  }

  /* History list */
  .history-list-header {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .history-entries { display: flex; flex-direction: column; gap: 10px; }

  .history-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .history-entry:hover { border-color: var(--border-light); }

  .history-entry-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .history-num {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
    min-width: 24px;
  }

  .history-time {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    flex: 1;
  }

  .history-price-info {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .history-correct {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 1px;
  }

  .correct-yes { color: var(--up); background: rgba(0,255,136,0.08); }
  .correct-no  { color: var(--down); background: rgba(255,51,102,0.08); }
  .correct-pending { color: var(--text-dim); background: rgba(100,100,150,0.08); }

  .history-entry-body {
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  .history-no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .history-no-data .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }

  .history-no-data p {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border-light);
    color: var(--text);
    padding: 11px 18px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    border-radius: 2px;
    z-index: 1000;
    animation: toastIn 0.3s ease;
    max-width: 300px;
  }

  @keyframes toastIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .toast.error   { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--accent); color: var(--accent); }

  /* Disclaimer */
  .disclaimer {
    margin-top: 48px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.6;
    border-radius: 2px;
  }

  .disclaimer::before {
    content: '⚠ DISCLAIMER  ';
    color: var(--warn);
    letter-spacing: 2px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

  @media (max-width: 650px) {
    .coin-grid { grid-template-columns: 1fr; }
    .hit-rate-box { flex-direction: column; align-items: flex-start; }
    .price-krw { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo"><span class="coin">COIN</span> SAYOMAYO<span class="dot">.</span></div>
    <div class="header-meta">
      <span><span class="live-dot"></span>AI 코인 분석</span>
      <span id="currentTime">--:--:--</span>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <!-- Market Bar -->
    <div class="market-bar">
      <div class="market-item">
        <div class="market-label">BTC/KRW</div>
        <div class="market-value" id="mb-btc">—</div>
      </div>
      <div class="market-item">
        <div class="market-label">ETH/KRW</div>
        <div class="market-value" id="mb-eth">—</div>
      </div>
      <div class="market-item">
        <div class="market-label">XRP/KRW</div>
        <div class="market-value" id="mb-xrp">—</div>
      </div>
      <div class="market-item">
        <div class="market-label">SOL/KRW</div>
        <div class="market-value" id="mb-sol">—</div>
      </div>
      <div class="market-item">
        <div class="market-label">USD/KRW</div>
        <div class="market-value" id="mb-usdkrw">—</div>
      </div>
      <div class="market-item">
        <div class="market-label">공포&탐욕</div>
        <div class="market-value" id="mb-fg">—</div>

// ==================== HIT RATE ====================
function isCorrect(signal, priceBefore, priceAfter) {
  if (!priceBefore || !priceAfter) return null;
  const change = (priceAfter - priceBefore) / priceBefore;
  if (signal === 'BUY')     return change > 0.005;
  if (signal === 'SELL')    return change < -0.005;
  if (signal === 'PARTIAL') return change < -0.005;
  if (signal === 'HOLD')    return Math.abs(change) <= 0.05;
  return null;
}

function calcHitRate(coinId) {
  const hist = histories[coinId];
  const judged = hist.filter(e => e.wasCorrect !== null && e.wasCorrect !== undefined);
  if (judged.length === 0) return { rate: null, correct: 0, total: 0 };
  const correct = judged.filter(e => e.wasCorrect === true).length;
  return { rate: Math.round((correct / judged.length) * 100), correct, total: judged.length };
}

function analyzeHitRateCauses(coinId) {
  const hist = histories[coinId].filter(e => e.wasCorrect !== null && e.wasCorrect !== undefined);
  if (hist.length < 2) return [];

  const wrong = hist.filter(e => !e.wasCorrect);
  const signals = { BUY: 0, SELL: 0, PARTIAL: 0, HOLD: 0 };
  wrong.forEach(e => signals[e.signal] = (signals[e.signal] || 0) + 1);

  const suggestions = [];
  const totalWrong = wrong.length;

  if (signals.BUY / totalWrong > 0.5) {
    suggestions.push('BUY 신호 오류가 많음 → 상승 과신 경향. 거래량 확인 후 매수 판단 요구 강화 필요');
  }
  if (signals.SELL / totalWrong > 0.5 || signals.PARTIAL / totalWrong > 0.5) {
    suggestions.push('SELL/PARTIAL 신호 오류가 많음 → 하락 과신 경향. 지지선 반등 가능성 더 고려 필요');
  }
  if (signals.HOLD / totalWrong > 0.5) {
    suggestions.push('HOLD 신호 오류가 많음 → 방향성 판단 미흡. 변동성 지표(ATR) 반영 강화 필요');
  }

  if (suggestions.length === 0) {
    suggestions.push('특정 패턴 없음 → 시장 변동성이 예측을 어렵게 만든 상황. 더 많은 데이터 축적 필요');
  }

  suggestions.push('단기 분석 신뢰도 향상을 위해 RSI 과매수/과매도 구간 (30/70 기준) 가중치 증가 권장');
  suggestions.push('공포&탐욕 지수가 10 이하 또는 90 이상일 때 역발상 전략 적용 고려');

  return suggestions;
}

function renderCoinGrid() {

  grid.innerHTML = COINS.map(c => renderCoinCard(c)).join('');
}

function renderCoinCard(coin) {

        <div class="price-usd">$${p.usd.toLocaleString(undefined, {maximumFractionDigits: 4})}</div>
      </div>`;
  } else {
    priceHtml = `<div class="card-price-section"><div class="price-placeholder">가격 로딩중...</div></div>`;
  }

  // Signal section
  let signalHtml = '';
  if (a.loading) {
    signalHtml = `<div class="card-signal-section"><div class="signal-badge sig-loading"><span class="signal-dot"></span>분석중...</div></div>`;
  } else if (a.signal) {
    const s = SIGNAL_MAP[a.signal] || SIGNAL_MAP.HOLD;
    let prevSignalHtml = '';
    if (lastEntry) {
      const ps = SIGNAL_MAP[lastEntry.signal] || SIGNAL_MAP.HOLD;
      prevSignalHtml = `<div class="prev-signal-badge">
        <span class="prev-label" style="color:var(--text-dim)">이전</span>
        <span class="prev-label" style="color:var(--text-muted)">${lastEntry.signal}</span>
        <span class="prev-arrow">→</span>
        <span class="prev-label" style="color:var(--text-muted)">${a.signal}</span>
        ${a.signal !== lastEntry.signal ? '<span style="color:var(--warn);font-size:9px">변경</span>' : '<span style="color:var(--text-dim);font-size:9px">유지</span>'}
      </div>`;
    }
    signalHtml = `<div class="card-signal-section">
      <div class="signal-badge ${s.cls}"><span class="signal-dot"></span>${s.label}</div>
      ${prevSignalHtml}
    </div>`;
  }

  // Analysis section
  let analysisHtml = '';
  if (a.loading) {
    analysisHtml = `<div class="card-analysis-section">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>`;
  } else if (a.analysis) {
    let prevComment = '';
    if (a.prevComment) {
      prevComment = `<div class="analysis-prev-comment">
        <div class="prev-comment-label">◦ 지난 분석 대비</div>
        ${a.prevComment}
      </div>`;
    }
    analysisHtml = `<div class="card-analysis-section">
      <div class="analysis-main">${a.analysis}</div>
      ${prevComment}
    </div>`;
  }

  // Indicators
  let indicatorsHtml = '';
  if (a.indicators && !a.loading) {
    const ind = a.indicators;
    const rsiClass = ind.rsi > 70 ? 'bearish' : ind.rsi < 30 ? 'bullish' : 'neutral';
    const trendClass = ind.trend === '상승' ? 'bullish' : ind.trend === '하락' ? 'bearish' : 'neutral';
    const volClass = ind.volume === '증가' ? 'bullish' : ind.volume === '감소' ? 'bearish' : 'neutral';
    const sentClass = ind.sentiment === '긍정' ? 'bullish' : ind.sentiment === '부정' ? 'bearish' : 'neutral';
    indicatorsHtml = `<div class="card-indicators">
      ${ind.rsi ? `<div class="ind-item"><div class="ind-label">RSI</div><div class="ind-value ${rsiClass}">${ind.rsi}</div></div>` : ''}
      ${ind.trend ? `<div class="ind-item"><div class="ind-label">추세</div><div class="ind-value ${trendClass}">${ind.trend}</div></div>` : ''}
      ${ind.volume ? `<div class="ind-item"><div class="ind-label">거래량</div><div class="ind-value ${volClass}">${ind.volume}</div></div>` : ''}
      ${ind.sentiment ? `<div class="ind-item"><div class="ind-label">뉴스감성</div><div class="ind-value ${sentClass}">${ind.sentiment}</div></div>` : ''}
      ${ind.support ? `<div class="ind-item"><div class="ind-label">지지선</div><div class="ind-value">${ind.support}</div></div>` : ''}

  // Timestamp
  let timestampHtml = '';

  return `

        <div class="card-coin-info">
          <div class="card-coin-id">${coin.id}</div>
          <div class="card-coin-name">${coin.emoji} ${coin.name}</div>
        </div>
        <button class="card-analyze-btn" onclick="analyzeCoin('${coin.id}')" id="btn-${coin.id}" ${a.loading ? 'disabled' : ''}>
          ${a.loading ? '분석중...' : '↻ 분석'}
        </button>
      </div>
      ${priceHtml}
      ${signalHtml}
      ${analysisHtml}
      ${indicatorsHtml}
      ${timestampHtml}
    </div>`;
}

// ==================== RENDER HISTORY TAB ====================
function renderHistoryTab() {
  const coinId = activeHistoryCoin;
  const hist = [...histories[coinId]].reverse().slice(0, 5);
  const { rate, correct, total } = calcHitRate(coinId);

  let hitRateHtml = '';
  if (rate !== null) {
    const rateClass = rate >= 70 ? 'good' : rate >= 60 ? 'warn' : 'bad';
    hitRateHtml = `
      <div class="hit-rate-box">
        <div class="hit-rate-left">
          <div class="hit-rate-number ${rateClass}">${rate}%</div>
          <div class="hit-rate-info">
            <div class="hit-rate-label">적중률</div>
            <div class="hit-rate-sub">${correct}/${total} 적중</div>
            <div class="hit-rate-bar">
              <div class="hit-rate-bar-fill ${rateClass}" style="width:${rate}%"></div>
            </div>
          </div>
        </div>
      </div>`;

    if (rate < 60) {
      const causes = analyzeHitRateCauses(coinId);
      hitRateHtml += `
        <div class="improvement-box">
          <div class="improvement-title">⚠ 적중률 ${rate}% — 원인 분석 및 개선 방향</div>
          <div class="improvement-body">
            적중률이 60% 미만으로 분석 방법 개선이 필요합니다. 주요 원인과 개선 방향:
            <ul class="improvement-list">
              ${causes.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
        </div>`;
    }
  } else {
    hitRateHtml = `
      <div class="hit-rate-box">
        <div class="hit-rate-left">
          <div class="hit-rate-number" style="color:var(--text-dim)">—</div>
          <div class="hit-rate-info">
            <div class="hit-rate-label">적중률</div>
            <div class="hit-rate-sub">데이터 부족 (최소 2회 분석 필요)</div>
          </div>
        </div>
      </div>`;
  }

  let entriesHtml = '';
  if (hist.length === 0) {
    entriesHtml = `
      <div class="history-no-data">
        <div class="icon">◈</div>
        <p>아직 분석 기록이 없습니다.<br>현재 분석 탭에서 분석을 실행하세요.</p>
      </div>`;
  } else {
    const allHist = histories[coinId];
    entriesHtml = `
      <div class="history-list-header">최근 ${hist.length}개 분석 기록</div>
      <div class="history-entries">
        ${hist.map((entry, i) => {
          const num = allHist.length - i;
          const timeStr = new Date(entry.timestamp).toLocaleString('ko-KR');
          const s = SIGNAL_MAP[entry.signal] || SIGNAL_MAP.HOLD;
          let correctHtml = '';
          if (entry.wasCorrect === true)  correctHtml = `<span class="history-correct correct-yes">✓ 적중</span>`;
          else if (entry.wasCorrect === false) correctHtml = `<span class="history-correct correct-no">✗ 미적중</span>`;
          else correctHtml = `<span class="history-correct correct-pending">평가 대기</span>`;

          const priceStr = entry.priceKRW ? `₩${Number(entry.priceKRW).toLocaleString()}` : '—';

          return `
            <div class="history-entry">
              <div class="history-entry-header">
                <span class="history-num">#${num}</span>
                <span class="history-time">${timeStr}</span>
                <span class="history-price-info">${priceStr}</span>
                <div class="signal-badge ${s.cls}" style="font-size:9px;padding:2px 8px;gap:5px">
                  <span class="signal-dot"></span>${s.label}
                </div>
                ${correctHtml}
              </div>
              ${entry.analysis ? `<div class="history-entry-body">${entry.analysis}</div>` : ''}
            </div>`;
        }).join('')}
      </div>`;
  }

  document.getElementById('historyContent').innerHTML = hitRateHtml + entriesHtml;
}

window.selectHistoryCoin = function(coinId) {
  activeHistoryCoin = coinId;

    btn.classList.toggle('active', btn.dataset.coin === coinId);

window.analyzeAll = async function() {
  const btn = document.getElementById('analyzeAllBtn');
  btn.disabled = true;
  btn.textContent = '▶ 분석중...';
  showToast('4개 코인 분석 시작', 'success');

  // Fetch fresh prices first
  await fetchMarketData();

  // Analyze sequentially to avoid rate limits
  for (const c of COINS) {
    await analyzeCoinInternal(c.id);
  }

  btn.disabled = false;
  btn.textContent = '▶ 전체 분석';

  const now = new Date().toLocaleString('ko-KR');
  document.getElementById('lastAnalyzedTime').textContent = `마지막 분석: ${now}`;
  showToast('전체 분석 완료', 'success');
  if (activeTab === 'history') renderHistoryTab();
};

window.analyzeCoin = async function(coinId) {
  await fetchMarketData();
  await analyzeCoinInternal(coinId);
  if (activeTab === 'history') renderHistoryTab();
};

async function analyzeCoinInternal(coinId) {
  const coin = COINS.find(c => c.id === coinId);
  const a = analyses[coinId];
  const p = prices[coinId];
  const hist = histories[coinId];
  const lastEntry = hist.length > 0 ? hist[hist.length - 1] : null;

  a.loading = true;
  renderCoinGrid();

  const now = new Date();
  const dateStr = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  const timeStr = now.toLocaleTimeString('ko-KR');

  let priceContext = '';
  if (p) {
    priceContext = `현재가: ₩${p.krw.toLocaleString()} ($${p.usd.toLocaleString()}) | 24h변동: ${p.change24h.toFixed(2)}% | USD/KRW: ${Math.round(usdKrw)}`;
  } else {
    priceContext = '가격 정보 없음 (최신 시장 데이터 기반으로 추정 분석)';
  }

  let prevContext = '';
  let prevSignalWasCorrect = null;
  if (lastEntry && p) {
    const wasCorrect = isCorrect(lastEntry.signal, lastEntry.priceKRW, p.krw);
    prevSignalWasCorrect = wasCorrect;
    const vsChange = ((p.krw - lastEntry.priceKRW) / lastEntry.priceKRW * 100);
    const vsSign = vsChange >= 0 ? '+' : '';
    const prevTime = new Date(lastEntry.timestamp).toLocaleString('ko-KR');
    prevContext = `
[이전 분석 정보]
이전 분석 일시: ${prevTime}
이전 분석 당시 가격: ₩${Number(lastEntry.priceKRW).toLocaleString()}
이전 의견: ${lastEntry.signal} (${SIGNAL_MAP[lastEntry.signal]?.label || lastEntry.signal})
이전 분석 대비 현재 가격 변동: ${vsSign}${vsChange.toFixed(2)}%
이전 의견 적중 여부: ${wasCorrect === null ? '판단 불가' : wasCorrect ? '✓ 적중' : '✗ 미적중'}`;
  }

  const prompt = `당신은 경험 많은 암호화폐 투자 분석가입니다.

분석 일시: ${dateStr} ${timeStr}
코인: ${coin.name} (${coin.id})
${priceContext}
${prevContext}

다음 JSON 형식으로만 응답하세요. 다른 텍스트 없이 JSON만:
{
  "signal": "BUY" | "HOLD" | "PARTIAL" | "SELL",
  "analysis": "현재 시장 상황, 기술적 지표 흐름, 최근 뉴스 감성을 종합한 투자 근거 2-3문장. 구체적 수치 포함.",
  "prevComment": ${lastEntry ? '"이전 분석의 적중 여부와 시장 변화 이유를 1-2문장으로. 이전 의견이 맞았는지, 왜 맞거나 틀렸는지 간략히."' : 'null'},
  "indicators": {
    "rsi": RSI 추정값 (숫자, 0-100),
    "trend": "상승" | "중립" | "하락",
    "volume": "증가" | "보통" | "감소",
    "sentiment": "긍정" | "중립" | "부정",
    "support": "주요 지지선 가격대 (원화 기준 문자열)"
  }
}

signal 기준:
- BUY: 기술지표 강세 + 감성 긍정 → 추가 매수 적기
- HOLD: 방향 불명확 → 현 포지션 유지
- PARTIAL: 일부 리스크 헤지 필요 → 분할 매도 권장
- SELL: 하락 신호 명확 → 전량 매도 검토`;

  try {
    const response = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || `서버 오류 ${response.status}`);
    }

    const data = await response.json();
    const textContent = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('');

    const jsonMatch = textContent.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('JSON 파싱 실패');

    const parsed = JSON.parse(jsonMatch[0]);

    // Update previous entry's wasCorrect
    if (lastEntry && prevSignalWasCorrect !== null) {
      hist[hist.length - 1].wasCorrect = prevSignalWasCorrect;
    }

    // Build new history entry
    const newEntry = {
      timestamp: now.toISOString(),
      signal: parsed.signal,
      priceKRW: p ? p.krw : null,
      priceUSD: p ? p.usd : null,
      analysis: parsed.analysis,
      prevComment: parsed.prevComment || null,
      wasCorrect: null,
    };

    // Keep last 10 entries
    hist.push(newEntry);
    if (hist.length > 10) hist.splice(0, hist.length - 10);

    // Update analysis state
    a.signal = parsed.signal;
    a.analysis = parsed.analysis;
    a.prevComment = parsed.prevComment || null;
    a.indicators = parsed.indicators;
    a.analyzedAt = now.toISOString();
    a.priceKRW = p ? p.krw : null;
    a.priceUSD = p ? p.usd : null;

    await saveHistory(coinId);

  } catch(e) {
    a.signal = 'HOLD';
    a.analysis = `분석 오류: ${e.message || '재시도해주세요.'}`;
    a.prevComment = null;
    showToast(`${coinId} 분석 실패: ${e.message}`, 'error');
  }

  a.loading = false;
  renderCoinGrid();
}

// ==================== TOAST ====================
let toastTimer;
window.showToast = function(msg, type = '') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 3000);
};

function showToast(msg, type) { window.showToast(msg, type); }

// ==================== INIT ====================
async function init() {
  showToast('데이터 로딩중...', '');
  renderCoinGrid();
  await loadHistories();
  await fetchMarketData();
  showToast('준비 완료 ✓', 'success');
}

init();
</script>
