<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYOMAYO — 투자 의견 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --border-light: #2a2a3e;
    --text: #e8e8f0;
    --text-muted: #6060a0;
    --text-dim: #3a3a5a;
    --accent: #00ff88;
    --accent-dim: rgba(0,255,136,0.1);
    --accent-glow: rgba(0,255,136,0.2);
    --warn: #ff6b35;
    --warn-dim: rgba(255,107,53,0.1);
    --danger: #ff3366;
    --danger-dim: rgba(255,51,102,0.1);
    --hold: #ffd700;
    --hold-dim: rgba(255,215,0,0.1);
    --up: #00ff88;
    --down: #ff3366;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    z-index: 100;
  }

  header .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span {
    color: var(--accent);
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
    display: inline-block;
    margin-right: 6px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* Main layout */
  main {
    padding: 40px 0 80px;
  }

  /* Add ticker section */
  .add-section {
    margin-bottom: 40px;
    padding: 28px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .add-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
  }

  .add-section h2 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .input-group select,
  .input-group input {
    background: var(--bg);
    border: 1px solid var(--border-light);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    border-radius: 1px;
    transition: border-color 0.2s;
    min-width: 130px;
  }

  .input-group input::placeholder { color: var(--text-dim); }

  .input-group select:focus,
  .input-group input:focus {
    border-color: var(--accent);
  }

  .input-group select option {
    background: #111;
  }

  .input-group.ticker-input input {
    min-width: 160px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .avg-price-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .avg-price-group label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .avg-price-group input {
    background: var(--bg);
    border: 1px solid var(--border-light);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    border-radius: 1px;
    min-width: 130px;
    transition: border-color 0.2s;
  }

  .avg-price-group input:focus {
    border-color: var(--accent);
  }

  .btn-add {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 11px 24px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-add:hover { background: #00cc6e; transform: translateY(-1px); }
  .btn-add:active { transform: translateY(0); }

  .btn-analyze-all {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 11px 24px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-analyze-all:hover {
    background: var(--accent-dim);
  }

  /* Portfolio grid */
  .portfolio-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .portfolio-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .portfolio-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  /* Stock card */
  .stock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.2s;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stock-card:hover { border-color: var(--border-light); transform: translateY(-2px); }

  .card-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-ticker {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .card-name {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .card-type-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 1px;
  }

  .type-us { background: rgba(100,150,255,0.15); color: #6496ff; border: 1px solid rgba(100,150,255,0.3); }
  .type-kr { background: rgba(255,100,100,0.15); color: #ff6464; border: 1px solid rgba(255,100,100,0.3); }
  .type-crypto { background: rgba(255,165,0,0.15); color: #ffaa00; border: 1px solid rgba(255,165,0,0.3); }
  .type-etf { background: rgba(150,100,255,0.15); color: #aa64ff; border: 1px solid rgba(150,100,255,0.3); }

  .card-price-row {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .price-main {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }

  .price-change {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 1px;
  }

  .price-up { color: var(--up); background: rgba(0,255,136,0.08); }
  .price-down { color: var(--down); background: rgba(255,51,102,0.08); }

  .avg-display {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    padding: 0 20px 12px;
    display: flex;
    gap: 20px;
  }

  .avg-display span { color: var(--text-dim); margin-right: 4px; }

  /* Signal badge */
  .signal-area {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .signal-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 1px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .signal-buy { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,255,136,0.3); }
  .signal-hold { background: var(--hold-dim); color: var(--hold); border: 1px solid rgba(255,215,0,0.3); }
  .signal-partial { background: var(--warn-dim); color: var(--warn); border: 1px solid rgba(255,107,53,0.3); }
  .signal-sell { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(255,51,102,0.3); }
  .signal-loading { background: rgba(100,100,150,0.1); color: var(--text-muted); border: 1px solid var(--border-light); }

  .signal-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  /* Analysis text */
  .analysis-text {
    padding: 14px 20px 16px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    min-height: 80px;
  }

  .analysis-text.loading {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .typing-indicator span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: typing 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Indicators */
  .indicators {
    padding: 12px 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .indicator-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .indicator-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .indicator-value {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .indicator-value.bullish { color: var(--up); }
  .indicator-value.bearish { color: var(--down); }
  .indicator-value.neutral { color: var(--hold); }

  /* Card actions */
  .card-actions {
    padding: 12px 20px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn-refresh {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }

  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

  .btn-remove {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }

  .btn-remove:hover { border-color: var(--danger); color: var(--danger); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--text-dim);
  }

  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 20px;
    opacity: 0.3;
  }

  .empty-state h3 {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 13px;
    line-height: 1.6;
  }

  /* Market status bar */
  .market-bar {
    margin-bottom: 32px;
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    gap: 32px;
    overflow-x: auto;
    border-radius: 2px;
  }

  .market-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    white-space: nowrap;
  }

  .market-item-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .market-item-value {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border-light);
    color: var(--text);
    padding: 12px 20px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    border-radius: 2px;
    z-index: 1000;
    animation: toastIn 0.3s ease;
    max-width: 320px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--accent); color: var(--accent); }

  /* Disclaimer */
  .disclaimer {
    margin-top: 48px;
    padding: 16px 20px;
    border: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.6;
    border-radius: 2px;
  }

  .disclaimer::before {
    content: '⚠ DISCLAIMER  ';
    color: var(--warn);
    letter-spacing: 2px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

  @media (max-width: 600px) {
    .portfolio-grid { grid-template-columns: 1fr; }
    .input-row { gap: 10px; }
    .market-bar { gap: 20px; }
    .add-section { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo">SAYOMAYO<span>.</span></div>
    <div class="header-meta">
      <span><span class="live-dot"></span>AI 투자의견</span>
      <span id="currentTime">--:--:--</span>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <!-- Market Overview Bar -->
    <div class="market-bar" id="marketBar">
      <div class="market-item">
        <div class="market-item-label">KOSPI</div>
        <div class="market-item-value" id="kospi">로딩중...</div>
      </div>
      <div class="market-item">
        <div class="market-item-label">NASDAQ</div>
        <div class="market-item-value" id="nasdaq">로딩중...</div>
      </div>
      <div class="market-item">
        <div class="market-item-label">S&P 500</div>
        <div class="market-item-value" id="sp500">로딩중...</div>
      </div>
      <div class="market-item">
        <div class="market-item-label">BTC/USD</div>
        <div class="market-item-value" id="btcusd">로딩중...</div>
      </div>
      <div class="market-item">
        <div class="market-item-label">USD/KRW</div>
        <div class="market-item-value" id="usdkrw">로딩중...</div>
      </div>
      <div class="market-item">
        <div class="market-item-label">공포&탐욕</div>
        <div class="market-item-value" id="feargreed">로딩중...</div>
      </div>
    </div>

    <!-- Add Ticker -->
    <div class="add-section">
      <h2>종목 추가</h2>
      <div class="input-row">
        <div class="input-group">
          <label>종목 유형</label>
          <select id="assetType">
            <option value="US">🇺🇸 미국주식</option>
            <option value="KR">🇰🇷 국내주식</option>
            <option value="CRYPTO">₿ 암호화폐</option>
            <option value="ETF">📊 ETF</option>
          </select>
        </div>
        <div class="input-group ticker-input">
          <label>티커 심볼</label>
          <input type="text" id="tickerInput" placeholder="AAPL / 005930 / BTC" />
        </div>
        <div class="avg-price-group">
          <label>평균 매수가 (선택)</label>
          <input type="number" id="avgPriceInput" placeholder="0" step="any" />
        </div>
        <div class="input-group">
          <label>통화</label>
          <select id="currency">
            <option value="USD">USD</option>
            <option value="KRW">KRW</option>
          </select>
        </div>
        <button class="btn-add" onclick="addTicker()">+ 추가</button>
        <button class="btn-analyze-all" onclick="analyzeAll()">전체 분석</button>
      </div>
    </div>

    <!-- Portfolio -->
    <div class="portfolio-header">
      <h2>포트폴리오</h2>
      <span class="portfolio-count" id="portfolioCount">0개 종목</span>
    </div>

    <div class="portfolio-grid" id="portfolioGrid">
      <div class="empty-state" id="emptyState">
        <div class="icon">◈</div>
        <h3>종목을 추가해보세요</h3>
        <p>위에서 티커를 입력하면<br>AI가 실시간으로 투자 의견을 분석합니다</p>
      </div>
    </div>

    <div class="disclaimer">
      이 앱은 AI 생성 의견으로 실제 투자 조언이 아닙니다. 투자 결정은 본인의 책임이며, 모든 투자에는 원금 손실 위험이 있습니다. 참고용으로만 활용하세요.
    </div>

  </div>
</main>

<script>
// ==================== STATE ====================
let portfolio = JSON.parse(localStorage.getItem('signal_portfolio') || '[]');

// ==================== TIME ====================
function updateTime() {
  const now = new Date();
  document.getElementById('currentTime').textContent =
    now.toLocaleTimeString('ko-KR', { hour12: false });
}
setInterval(updateTime, 1000);
updateTime();

// ==================== MARKET OVERVIEW ====================
async function fetchMarketOverview() {
  // Crypto Fear & Greed
  try {
    const fg = await fetch('https://api.alternative.me/fng/?limit=1');
    const fgData = await fg.json();
    const val = fgData.data[0].value;
    const label = fgData.data[0].value_classification;
    const el = document.getElementById('feargreed');
    el.textContent = `${val} (${label})`;
    el.style.color = val > 60 ? 'var(--up)' : val < 40 ? 'var(--down)' : 'var(--hold)';
  } catch(e) {}

  // BTC price via CoinGecko
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true');
    const d = await r.json();
    const btcEl = document.getElementById('btcusd');
    const btc = d.bitcoin;
    btcEl.textContent = `$${btc.usd.toLocaleString()}`;
    btcEl.style.color = btc.usd_24h_change > 0 ? 'var(--up)' : 'var(--down)';
  } catch(e) {}

  // USD/KRW via exchangerate
  try {
    const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    const d = await r.json();
    document.getElementById('usdkrw').textContent = d.rates.KRW.toFixed(0) + '원';
  } catch(e) {}

  // Major indices — note: due to CORS, we'll show a note
  document.getElementById('kospi').textContent = '장중확인';
  document.getElementById('nasdaq').textContent = '장중확인';
  document.getElementById('sp500').textContent = '장중확인';
}

fetchMarketOverview();

// ==================== PORTFOLIO MANAGEMENT ====================
function savePortfolio() {
  // Save only non-analysis data
  const toSave = portfolio.map(p => ({
    id: p.id,
    ticker: p.ticker,
    type: p.type,
    currency: p.currency,
    avgPrice: p.avgPrice,
  }));
  localStorage.setItem('signal_portfolio', JSON.stringify(toSave));
}

function addTicker() {
  const type = document.getElementById('assetType').value;
  const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
  const avgPrice = parseFloat(document.getElementById('avgPriceInput').value) || null;
  const currency = document.getElementById('currency').value;

  if (!ticker) { showToast('티커를 입력해주세요', 'error'); return; }
  if (portfolio.find(p => p.ticker === ticker)) {
    showToast(`${ticker} 이미 추가된 종목입니다`, 'error'); return;
  }

  const item = {
    id: Date.now(),
    ticker,
    type,
    currency,
    avgPrice,
    price: null,
    change: null,
    signal: null,
    analysis: null,
    indicators: null,
    loading: false,
  };

  portfolio.push(item);
  savePortfolio();
  renderPortfolio();

  document.getElementById('tickerInput').value = '';
  document.getElementById('avgPriceInput').value = '';

  showToast(`${ticker} 추가됨`, 'success');
  // Auto analyze
  analyzeItem(item.id);
}

function removeTicker(id) {
  portfolio = portfolio.filter(p => p.id !== id);
  savePortfolio();
  renderPortfolio();
}

function analyzeAll() {
  if (portfolio.length === 0) { showToast('종목을 먼저 추가해주세요', 'error'); return; }
  portfolio.forEach(item => analyzeItem(item.id));
  showToast('전체 분석 시작', 'success');
}

// ==================== RENDER ====================
function renderPortfolio() {
  const grid = document.getElementById('portfolioGrid');
  const count = document.getElementById('portfolioCount');
  count.textContent = `${portfolio.length}개 종목`;

  if (portfolio.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="icon">◈</div>
        <h3>종목을 추가해보세요</h3>
        <p>위에서 티커를 입력하면<br>AI가 실시간으로 투자 의견을 분석합니다</p>
      </div>`;
    return;
  }

  grid.innerHTML = portfolio.map(item => renderCard(item)).join('');
}

function renderCard(item) {
  const typeBadge = { US: '미국주식', KR: '국내주식', CRYPTO: '암호화폐', ETF: 'ETF' };
  const typeClass = { US: 'type-us', KR: 'type-kr', CRYPTO: 'type-crypto', ETF: 'type-etf' };

  let priceHtml = '';
  if (item.price) {
    const sym = item.currency === 'KRW' ? '₩' : '$';
    const changeSign = item.change >= 0 ? '+' : '';
    priceHtml = `
      <div class="card-price-row">
        <div class="price-main">${sym}${item.price.toLocaleString()}</div>
        <div class="price-change ${item.change >= 0 ? 'price-up' : 'price-down'}">
          ${changeSign}${item.change?.toFixed(2)}%
        </div>
      </div>`;
    if (item.avgPrice) {
      const pnl = ((item.price - item.avgPrice) / item.avgPrice * 100).toFixed(2);
      const pnlSign = pnl >= 0 ? '+' : '';
      priceHtml += `<div class="avg-display"><span>평단</span>${sym}${item.avgPrice.toLocaleString()} <span>수익률</span><span style="color:${pnl >= 0 ? 'var(--up)' : 'var(--down)'}">${pnlSign}${pnl}%</span></div>`;
    }
  }

  let signalHtml = '';
  if (item.loading) {
    signalHtml = `<div class="signal-area"><div class="signal-badge signal-loading">
      <span class="signal-dot"></span>분석중...</div></div>`;
  } else if (item.signal) {
    const signalMap = {
      BUY: { cls: 'signal-buy', label: '▲ 추가 매수' },
      HOLD: { cls: 'signal-hold', label: '◼ 보류' },
      PARTIAL: { cls: 'signal-partial', label: '▽ 분할 매도' },
      SELL: { cls: 'signal-sell', label: '▼ 전량 매도' },
    };
    const s = signalMap[item.signal] || signalMap.HOLD;
    signalHtml = `<div class="signal-area"><div class="signal-badge ${s.cls}">
      <span class="signal-dot"></span>${s.label}</div></div>`;
  }

  let analysisHtml = '';
  if (item.loading) {
    analysisHtml = `<div class="analysis-text loading">
      <div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  } else if (item.analysis) {
    analysisHtml = `<div class="analysis-text">${item.analysis}</div>`;
  }

  let indicatorsHtml = '';
  if (item.indicators) {
    const ind = item.indicators;
    indicatorsHtml = `<div class="indicators">
      ${ind.rsi ? `<div class="indicator-item">
        <div class="indicator-label">RSI</div>
        <div class="indicator-value ${ind.rsi > 70 ? 'bearish' : ind.rsi < 30 ? 'bullish' : 'neutral'}">${ind.rsi}</div>
      </div>` : ''}
      ${ind.trend ? `<div class="indicator-item">
        <div class="indicator-label">추세</div>
        <div class="indicator-value ${ind.trend === '상승' ? 'bullish' : ind.trend === '하락' ? 'bearish' : 'neutral'}">${ind.trend}</div>
      </div>` : ''}
      ${ind.volume ? `<div class="indicator-item">
        <div class="indicator-label">거래량</div>
        <div class="indicator-value ${ind.volume === '증가' ? 'bullish' : 'neutral'}">${ind.volume}</div>
      </div>` : ''}
      ${ind.sentiment ? `<div class="indicator-item">
        <div class="indicator-label">뉴스 감성</div>
        <div class="indicator-value ${ind.sentiment === '긍정' ? 'bullish' : ind.sentiment === '부정' ? 'bearish' : 'neutral'}">${ind.sentiment}</div>
      </div>` : ''}
      ${ind.support ? `<div class="indicator-item">
        <div class="indicator-label">지지선</div>
        <div class="indicator-value">${ind.support}</div>
      </div>` : ''}
    </div>`;
  }

  return `
    <div class="stock-card" id="card-${item.id}">
      <div class="card-header">
        <div>
          <div class="card-ticker">${item.ticker}</div>
          <div class="card-name">${item.name || ''}</div>
        </div>
        <div class="card-type-badge ${typeClass[item.type]}">${typeBadge[item.type]}</div>
      </div>
      ${priceHtml}
      ${signalHtml}
      ${analysisHtml}
      ${indicatorsHtml}
      <div class="card-actions">
        <button class="btn-refresh" onclick="analyzeItem(${item.id})">↻ 재분석</button>
        <button class="btn-remove" onclick="removeTicker(${item.id})">✕ 제거</button>
      </div>
    </div>`;
}

function updateCard(id) {
  const item = portfolio.find(p => p.id === id);
  if (!item) return;
  const el = document.getElementById(`card-${id}`);
  if (el) {
    el.outerHTML = renderCard(item);
  }
}

// ==================== PRICE FETCH ====================
async function fetchPrice(item) {
  if (item.type === 'CRYPTO') {
    try {
      const coinMap = {
        BTC: 'bitcoin', ETH: 'ethereum', SOL: 'solana',
        XRP: 'ripple', DOGE: 'dogecoin', ADA: 'cardano',
        AVAX: 'avalanche-2', DOT: 'polkadot', MATIC: 'matic-network',
        LINK: 'chainlink', UNI: 'uniswap', ATOM: 'cosmos',
        LTC: 'litecoin', BCH: 'bitcoin-cash', NEAR: 'near',
        APT: 'aptos', ARB: 'arbitrum', OP: 'optimism',
      };
      const coinId = coinMap[item.ticker] || item.ticker.toLowerCase();
      const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd&include_24hr_change=true&include_market_cap=true`);
      const d = await r.json();
      if (d[coinId]) {
        item.price = d[coinId].usd;
        item.change = d[coinId].usd_24h_change;
        item.currency = 'USD';
        return true;
      }
    } catch(e) {}
    return false;
  }
  // For stocks, we can't directly call Yahoo Finance due to CORS
  // We'll rely on AI knowledge for price context and signal analysis
  return false;
}

// ==================== AI ANALYSIS ====================
async function analyzeItem(id) {
  const item = portfolio.find(p => p.id === id);
  if (!item) return;

  item.loading = true;
  updateCard(id);

  // Fetch price if crypto
  await fetchPrice(item);

  // Build context
  const now = new Date();
  const dateStr = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  const timeStr = now.toLocaleTimeString('ko-KR');

  let priceContext = '';
  if (item.price) {
    priceContext = `현재가: $${item.price.toLocaleString()} (24h변동: ${item.change?.toFixed(2)}%)`;
    if (item.avgPrice) {
      const pnl = ((item.price - item.avgPrice) / item.avgPrice * 100).toFixed(2);
      priceContext += `\n평균매수가: $${item.avgPrice} (현재 수익률: ${pnl}%)`;
    }
  } else {
    priceContext = item.avgPrice ? `평균매수가: ${item.currency === 'KRW' ? '₩' : '$'}${item.avgPrice}` : '가격 정보 없음 (최신 시장 데이터 기반 분석)';
  }

  const typeLabel = { US: '미국주식', KR: '국내주식', CRYPTO: '암호화폐', ETF: 'ETF' };

  const prompt = `당신은 경험 많은 투자 분석가입니다. 아래 종목에 대해 오늘 날짜 기준으로 투자 의견을 제시해주세요.

날짜: ${dateStr} ${timeStr}
종목: ${item.ticker} (${typeLabel[item.type]})
${priceContext}

다음 JSON 형식으로만 응답하세요. 다른 텍스트 없이 JSON만:
{
  "signal": "BUY" | "HOLD" | "PARTIAL" | "SELL",
  "name": "종목명 (한국어/영어)",
  "analysis": "2-3문장으로 현재 시장 상황, 기술적 지표 흐름, 최근 뉴스 감성을 종합한 투자 근거. 구체적 수치 포함.",
  "indicators": {
    "rsi": RSI 추정값 (숫자, 0-100),
    "trend": "상승" | "중립" | "하락",
    "volume": "증가" | "보통" | "감소",
    "sentiment": "긍정" | "중립" | "부정",
    "support": "주요 지지선 가격대 (문자열)"
  }
}

signal 기준:
- BUY: 기술지표 강세 + 뉴스 감성 긍정 → 추가 매수 적기
- HOLD: 방향 불명확 → 현 포지션 유지
- PARTIAL: 일부 리스크 헤지 필요 → 분할 매도 권장
- SELL: 하락 신호 명확 → 전량 매도 검토`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();

    // Extract text from content blocks
    const textContent = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('');

    // Parse JSON
    const jsonMatch = textContent.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      const parsed = JSON.parse(jsonMatch[0]);
      item.signal = parsed.signal;
      item.analysis = parsed.analysis;
      item.indicators = parsed.indicators;
      if (parsed.name && !item.name) item.name = parsed.name;
    }
  } catch(e) {
    item.signal = 'HOLD';
    item.analysis = '분석 중 오류가 발생했습니다. 재시도해주세요.';
  }

  item.loading = false;
  updateCard(id);
  savePortfolio();
}

// ==================== TOAST ====================
let toastTimer;
function showToast(msg, type = '') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  clearTimeout(toastTimer);

  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);

  toastTimer = setTimeout(() => el.remove(), 3000);
}

// ==================== INIT ====================
function init() {
  // Restore portfolio without analysis (need to re-analyze)
  portfolio = portfolio.map(p => ({ ...p, signal: null, analysis: null, indicators: null, loading: false }));
  renderPortfolio();

  // Auto-set currency based on type
  document.getElementById('assetType').addEventListener('change', (e) => {
    const cur = document.getElementById('currency');
    if (e.target.value === 'KR') cur.value = 'KRW';
    else cur.value = 'USD';
  });

  // Enter key on ticker input
  document.getElementById('tickerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTicker();
  });
}

init();
</script>
